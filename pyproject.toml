[project]
name = "callguard"
version = "0.1.0"
description = "RAG assistant for vulnerabilities in contact-center and UC products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "markdown>=3.11.1",
    "openai>=3.33.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
