[project]
name = "callguard"
version = "0.1.0"
description = "RAG assistant for vulnerabilities in contact-center and UC products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langsmith>=0.14.11",
    "openai>=3.33.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
