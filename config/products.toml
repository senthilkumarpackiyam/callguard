# CallGuard's product list: what we cover, and every name each product goes by.
# Decided in Phase 1 (2026-10-17). See NOTES.md for the reasoning.
#
# scope     "in"    = we collect its CVEs and answer questions about it
#           "cloud" = a cloud service: CVEs are rare, so answers say that instead of implying "safe"
#           "out"   = deliberately not covered, and CallGuard says so
# aka       what people call it in questions
# cpe       NVD's product names, as "vendor:product" (* matches anything)
# affected  names in the vendor's own list, as "vendor | product" (text to look for, any case)
# exclude   skip vendor-list entries whose product name contains this text

# ---------- Cisco ----------

[[product]]
id = "C1"
name = "Cisco Unified Communications Manager"
vendor = "Cisco"
scope = "in"
aka = ["CUCM", "CallManager", "Unified CM", "UCM", "Business Edition 6000"]
cpe = ["cisco:unified_communications_manager", "cisco:unified_callmanager", "cisco:call_manager",
       "cisco:unified_communications_manager_session_management_edition", "cisco:business_edition_*"]
affected = ["cisco | unified communications manager", "cisco | unified_communications_manager"]
exclude = ["presence"]

[[product]]
id = "C2"
name = "Cisco Unified CM IM and Presence"
vendor = "Cisco"
